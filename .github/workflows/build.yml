name: Generate Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project & Copy Files
        run: |
          cordova create myApp com.reelcee.settings "Settings"
          rm -rf myApp/www/*
          # Copying all necessary files, assets, and standalone folders to the www directory
          cp index.html myApp/www/
          cp script.js myApp/www/
          cp style.css myApp/www/
          cp -r assets/ myApp/www/
          cp -r fonts/ myApp/www/

      - name: Configure Android Theme and Webview Preferences
        run: |
          cd myApp
          # Safely insert preferences inside the <widget> node of config.xml
          sed -i '/<\/widget>/i \    <preference name="DisallowOverscroll" value="true" />' config.xml
          sed -i '/<\/widget>/i \    <preference name="BackupWebStorage" value="none" />' config.xml

      - name: Install Network Information Plugin
        run: |
          cd myApp
          cordova plugin add cordova-plugin-network-information

      - name: Setup Android Platform
        run: |
          cd myApp
          cordova platform add android

      - name: Compile APK
        run: |
          cd myApp
          cordova build android --debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Settings-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
